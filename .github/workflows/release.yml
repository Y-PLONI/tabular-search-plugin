name: Release

# Every push to master tests, validates, publishes to the Otzaria store and
# creates the GitHub release v<manifest version>. The store rejects a version
# it already has, and an existing release is not recreated, so a push without
# a version bump publishes nothing new. Pull requests only test and build.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test & validate (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests (model, syntax, compiler)
        run: node --test tests/*.test.js

      - name: Validate & build plugin (no publishing)
        id: otzaria
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugin
          build: 'true'
          publish: 'false'

      - name: Upload .otzplugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: otzplugin
          path: ${{ steps.otzaria.outputs.plugin-file }}
          if-no-files-found: error

  release:
    name: Validate, publish & release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests (model, syntax, compiler)
        run: node --test tests/*.test.js

      # Official Otzaria action: validates, packages .otzplugin, and publishes
      # to the store. Plugin is identified by manifest.id; version must increase.
      # build: 'true' keeps the .otzplugin for the release even when nothing is published.
      - name: Validate, package & publish to otzaria.org
        id: otzaria
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugin
          build: 'true'
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}

      - name: Determine version and tag
        id: meta
        run: |
          version="$(node -p "require('./plugin/manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in plugin/manifest.json: '$version' (expected X.Y.Z)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"   >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping create"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist yet"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.otzaria.outputs.plugin-file }}
          body: |
            ## חיפוש טבלאי (בסגנון בר-אילן) — ${{ steps.meta.outputs.tag }}

            חיפוש טבלאי לאוצריא בסידור ובאפשרויות של בר-אילן: מרכיבים וחלופות, מרחקים וכיוון,
            מאפייני מרכיב, שלילה, מאגרים, חיפוש קל ומתקדם, שאילתות קודמות ומשפחות מילים.
            מבוסס על התוסף המקורי מאת יהל, סנאי ויפל.

            ### התקנה
            הורד את קובץ ה-`.otzplugin` למטה, ובאוצריא:
            **כלים → 🧩 תוספים → ⊕ התקן תוסף חדש**, ובחר את הקובץ.

            ### Checksum
            ```
            SHA-256: ${{ steps.otzaria.outputs.sha256 }}
            ```
