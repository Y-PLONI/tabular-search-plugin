name: Release

# Publishing to the Otzaria store happens ONLY on a version tag (vX.Y.Z) or a
# manual run. Pushes and pull requests only test, validate and build.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the Otzaria store and create the GitHub release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Test & validate
    if: (github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests (model, syntax, compiler)
        run: node --test tests/

      # Same checks as the store; builds the .otzplugin but never publishes.
      - name: Validate & build plugin
        id: otzaria
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugin
          build: 'true'
          publish: 'false'

      - name: Upload .otzplugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: otzplugin
          path: ${{ steps.otzaria.outputs.plugin-file }}
          if-no-files-found: error

  release:
    name: Validate, publish & release
    if: (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests (model, syntax, compiler)
        run: node --test tests/

      - name: Determine version and tag
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./plugin/manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in plugin/manifest.json: '$version' (expected X.Y.Z)" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "v$version" ]]; then
            echo "Tag $REF_NAME does not match plugin/manifest.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"   >> "$GITHUB_OUTPUT"

      # Official Otzaria action: validates, packages .otzplugin and publishes to
      # the store. The plugin is identified by manifest.id; the version must increase.
      - name: Validate, package & publish to otzaria.org
        id: otzaria
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: plugin
          publish: 'true'
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}

      - name: Check if release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping create"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist yet"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.otzaria.outputs.plugin-file }}
          body: |
            ## חיפוש טבלאי (בסגנון בר-אילן) — ${{ steps.meta.outputs.tag }}

            חיפוש טבלאי לאוצריא בסידור ובאפשרויות של בר-אילן: מרכיבים וחלופות, מרחקים וכיוון,
            מאפייני מרכיב, שלילה, מאגרים, חיפוש קל ומתקדם, שאילתות קודמות ומשפחות מילים.
            מבוסס על התוסף המקורי מאת יהל, סנאי ויפל.

            ### התקנה
            הורד את קובץ ה-`.otzplugin` למטה, ובאוצריא:
            **כלים → 🧩 תוספים → ⊕ התקן תוסף חדש**, ובחר את הקובץ.

            ### Checksum
            ```
            SHA-256: ${{ steps.otzaria.outputs.sha256 }}
            ```
